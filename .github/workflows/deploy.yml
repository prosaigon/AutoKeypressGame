name: Build & Deploy Application Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    name: Publish Release Artifacts
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore AutoKeypressGame.sln

    - name: Publish Windows App Executable
      run: |
        dotnet publish AutoClicker/AutoClicker.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish_output

    - name: Compress Release Artifact
      run: |
        Compress-Archive -Path publish_output/* -DestinationPath AutoClicker-v1.5.0-win-x64.zip

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoClicker-Executable
        path: AutoClicker-v1.5.0-win-x64.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: AutoClicker-v1.5.0-win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
